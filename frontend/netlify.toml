[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # These are public browser configuration values, not privileged secrets.
  # Never omit SUPABASE_SERVICE_ROLE_KEY or other private server keys.
  # Ignore only public configuration and low-entropy feature flags. Private
  # credentials remain protected by Netlify's secret scanner.
  SECRETS_SCAN_OMIT_KEYS = "AI_CHATBOT_ENABLED,AI_PROVIDER,APP_ENV,AWS_REGION,BEDROCK_LLM_MODEL,BUSINESS_VERIFICATION_MODE,CORS_ORIGINS,DEMO_BUSINESS_ID,DEMO_LOGIN_ENABLED,DEMO_USERNAME,DEMO_PASSWORD,DEMO_TOKEN,DOT_PROVIDER_API_URL,NETLIFY_NEXT_PLUGIN_SKIP,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NODE_VERSION,OPENAI_MODEL,OTP_EXPIRATION_MINUTES,OTP_EXPIRY_MINUTES,OTP_MODE,OTP_TEST_CODE,SUPABASE_URL,SUPABASE_ANON_KEY,USE_AWS,VITE_API_BASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"
  SECRETS_SCAN_OMIT_PATHS = "node_modules/**,.aistudio/**,dist/**"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
