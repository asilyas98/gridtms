[[redirects]]
  from = "/business/verify"
  to = "/.netlify/functions/business-verify"
  status = 200
  force = true

[[redirects]]
  from = "/storage/upload"
  to = "/.netlify/functions/storage-upload"
  status = 200
  force = true

[[redirects]]
  from = "/documents/analyze"
